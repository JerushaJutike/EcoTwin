services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile

    container_name: ecotwin-backend

    ports:
      - "8000:8000"

    volumes:
      - ./rl/models:/app/rl/models:ro

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ecotwin-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped